name: Voice models

# The neural voices the app runs on the device (Piper, rhasspy/piper-voices): one female and one male voice per
# language, plus the phonemizer and the ONNX runtime. Kept in the "tts" branch and published at /matematix/tts/;
# each device downloads only the voice it uses, the first time it presses 🔊, and keeps it for offline use.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download
        run: |
          set -e
          mkdir -p out && cd out
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main
          get() { mkdir -p "$1"; for f in onnx onnx.json MODEL_CARD; do
            src="$HF/$2"; [ "$f" = MODEL_CARD ] && src="$(dirname "$HF/$2")/MODEL_CARD" || src="$HF/$2.$f"
            curl -fsSL "$src" -o "$1/$3.$f"; done; }
          get es es/es_ES/sharvard/medium/es_ES-sharvard-medium sharvard
          get es es/es_ES/davefx/medium/es_ES-davefx-medium davefx
          get ca ca/ca_ES/upc_ona/medium/ca_ES-upc_ona-medium ona
          get ca ca/ca_ES/upc_pau/x_low/ca_ES-upc_pau-x_low pau
          get en en/en_GB/alba/medium/en_GB-alba-medium alba
          get en en/en_GB/alan/medium/en_GB-alan-medium alan
          mkdir -p lib && cd lib
          npm pack @diffusionstudio/piper-wasm@1.0.0 onnxruntime-web@1.18.0 >/dev/null
          tar xzf diffusionstudio-piper-wasm-1.0.0.tgz && cp package/build/piper_phonemize.* . && rm -rf package
          tar xzf onnxruntime-web-1.18.0.tgz && cp package/dist/ort-wasm-simd.wasm package/dist/ort-wasm.wasm . && rm -rf package *.tgz
          cd .. && find . -type f -printf '%s %p\n' | sort -k2
      - name: Publish to the tts branch
        run: |
          cd out
          git init -q -b tts && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Voice models"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tts
